<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080d13" />
    <title>Play</title>
    <link rel="stylesheet" href="style.css" />
    <script src="preferences.js" defer></script>
    <script src="worlds.js" defer></script>
    <script src="cartoon.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main id="arena" aria-label="Game arena">
      <canvas
        id="game"
        aria-label="Game arena. Steer with mouse, touch, or arrows. Hold mouse or Space, or use a second finger to boost."
      ></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <header id="hud" class="hud hidden">
        <div id="cashoutProgress" class="cashout-progress">
          <div class="meter-values">
            <strong id="cashoutProgressAmount">0,00</strong>
            <span class="meter-goal"><i aria-hidden="true"></i><span id="cashoutGoal">50 BRL</span></span>
          </div>
          <div
            id="cashoutProgressBar"
            class="progress-track"
            role="progressbar"
            aria-label="Score toward exit"
            aria-valuemin="0"
            aria-valuemax="50"
            aria-valuenow="0"
          >
            <div id="cashoutProgressFill" class="progress-fill"></div>
          </div>
        </div>
      </header>
      <div id="stick" aria-label="Joystick"><i></i></div>
      <canvas
        id="minimap"
        class="minimap hidden"
        width="200"
        height="200"
        aria-label="Arena map with snakes and exit line"
      ></canvas>

      <section id="lobby" class="overlay lobby" aria-labelledby="lobbyTitle">
        <div class="lobby-content">
          <h1 id="lobbyTitle">ENTER ARENA</h1>
          <p id="entryCost"></p>
          <p id="availableBalance"></p>
          <p id="betError"></p>
          <details id="menuSettings" lang="ru">
            <summary>Настройки игры</summary>
            <div id="settingFields"></div>
          </details>
          <button id="playButton" class="primary">
            ENTER ARENA <span>↗</span>
          </button>
          <a class="studio-link" href="studio.html">GAME STUDIO</a>
        </div>
      </section>
      <section
        id="result"
        class="overlay result hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="resultTitle"
      >
        <div class="result-card">
          <div id="resultKicker" class="season-label">GREEN LINE REACHED</div>
          <div id="resultIcon" class="result-icon">♛</div>
          <h2 id="resultTitle">CASH<br /><em>OUT!</em></h2>
          <div id="resultAmount" class="result-amount">0.00</div>
          <div id="resultDetail" class="result-detail">BALANCE CASHED OUT</div>
          <div class="result-divider"></div>
          <p id="resultMessage">Every pickup counts.</p>
          <button id="againButton" class="primary">
            PLAY AGAIN <span>↗</span></button
          ><button id="lobbyButton" class="secondary">BACK TO LOBBY</button>
        </div>
      </section>
      <div id="pausePanel" class="pause-panel hidden">
        <strong>PAUSED</strong><span>Press Esc or tap to resume</span>
        <a class="studio-link" href="studio.html" target="_blank" rel="noopener"
          >GAME STUDIO</a
        >
      </div>
    </main>
  </body>
</html>
